name: Publish CLI to npm

# Publishes @dmrlzz/davecode through npm Trusted Publishing: npm trusts this workflow in this
# repository, so no token or one-time password is stored anywhere. Provenance is attached.
#
# Two jobs: "build" installs, checks and packs the CLI with read-only permissions; "publish" holds
# the OIDC identity, runs no project code, and publishes only the tarball that "build" produced.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the v (must match packages/cli/package.json)
        required: true
        type: string

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Check the version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(node -p "require('./packages/cli/package.json').version")" = "$VERSION"
          if npm view "@dmrlzz/davecode@$VERSION" version >/dev/null 2>&1; then
            echo "@dmrlzz/davecode@$VERSION is already published" >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Pack
        working-directory: packages/cli
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: davecode-npm-tarball
          path: ${{ runner.temp }}/pack/dmrlzz-davecode-${{ inputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: davecode-npm-tarball
          path: ${{ runner.temp }}/pack
      # No registry-url here: setup-node would export a placeholder NODE_AUTH_TOKEN, and npm
      # must authenticate with the workflow's OIDC identity instead. No cache: nothing is installed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Trusted Publishing needs npm 11.5 or later.
      - run: npm install -g npm@11
      - name: Check the tarball and the version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tarball="$RUNNER_TEMP/pack/dmrlzz-davecode-$VERSION.tgz"
          test -f "$tarball"
          manifest="$(tar -xzOf "$tarball" package/package.json)"
          test "$(printf '%s' "$manifest" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).name")" = "@dmrlzz/davecode"
          test "$(printf '%s' "$manifest" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")" = "$VERSION"
          if npm view "@dmrlzz/davecode@$VERSION" version >/dev/null 2>&1; then
            echo "@dmrlzz/davecode@$VERSION is already published" >&2
            exit 1
          fi
      - name: Publish
        run: npm publish "$RUNNER_TEMP/pack/dmrlzz-davecode-$VERSION.tgz" --access public
      - name: Confirm it is installable
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if [ "$(npm view @dmrlzz/davecode version)" = "$VERSION" ]; then exit 0; fi
            sleep 20
          done
          echo "npm does not list $VERSION as latest yet" >&2
          exit 1
