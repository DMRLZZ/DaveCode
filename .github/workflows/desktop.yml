name: Desktop installer

# Builds and tests the installers and uploads them as workflow artifacts. It never writes to the
# repository: desktop-release.yml downloads these artifacts (actions: read) and publishes them.

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  installer:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: DaveCode-Windows
            files: packages/desktop/release/*.exe
          - os: macos-latest
            name: DaveCode-macOS
            files: packages/desktop/release/*.dmg
          - os: ubuntu-latest
            name: DaveCode-Linux
            files: packages/desktop/release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm desktop:package
      - if: runner.os != 'Linux'
        run: pnpm --filter @davecode/desktop smoke --packaged
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm --filter @davecode/desktop smoke --packaged
      # A broken signature makes macOS call a downloaded app "damaged"; check the copy in the DMG.
      - if: runner.os == 'macOS'
        working-directory: packages/desktop/release
        run: |
          codesign --verify --deep --strict --verbose=2 mac-arm64/DaveCode.app
          hdiutil attach DaveCode-macOS-arm64.dmg -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/dmg/DaveCode.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.files }}
            packages/desktop/release/smoke/desktop.png
            packages/desktop/release/smoke/startup.png
            packages/desktop/release/smoke/startup.json
