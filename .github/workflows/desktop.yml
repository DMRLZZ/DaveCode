name: Desktop installer

on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm desktop:package
      - run: pnpm --filter @davecode/desktop smoke --packaged
      - uses: actions/upload-artifact@v7
        with:
          name: DaveCode-Windows
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/smoke/desktop.png
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME packages/desktop/release/*.exe --clobber
