name: Desktop installer

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: DaveCode-Windows
            files: packages/desktop/release/*.exe
          - os: macos-latest
            name: DaveCode-macOS
            files: packages/desktop/release/*.dmg
          - os: ubuntu-latest
            name: DaveCode-Linux
            files: packages/desktop/release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm desktop:package
      - if: runner.os != 'Linux'
        run: pnpm --filter @davecode/desktop smoke --packaged
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm --filter @davecode/desktop smoke --packaged
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.files }}
            packages/desktop/release/smoke/desktop.png
            packages/desktop/release/smoke/startup.png
            packages/desktop/release/smoke/startup.json
