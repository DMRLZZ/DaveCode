<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="DaveCode dashboard: quota-aware AI gateway and autonomous coding engine." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>DaveCode</title>
    <script>
      // Apply the stored theme before first paint to avoid a light/dark flash.
      let storedTheme = null;
      try {
        storedTheme = localStorage.getItem('davecode.theme');
      } catch (_) {}
      if (storedTheme === 'light' || storedTheme === 'dark') {
        document.documentElement.dataset.theme = storedTheme;
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
